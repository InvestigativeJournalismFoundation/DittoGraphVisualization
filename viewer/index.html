<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ditto Graph Viewer</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f1117;
      color: #e0e0e0;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 10px 16px;
      background: #1a1d27;
      border-bottom: 1px solid #2a2d3a;
      display: flex;
      align-items: center;
      gap: 16px;
      flex-shrink: 0;
      z-index: 10;
    }

    header h1 { font-size: 15px; font-weight: 600; color: #fff; }
    header .stats { font-size: 12px; color: #777; }

    #main {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    #sigma-container {
      flex: 1;
      position: relative;
    }

    #sidebar {
      width: 260px;
      background: #1a1d27;
      border-left: 1px solid #2a2d3a;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      flex-shrink: 0;
    }

    .sidebar-section {
      padding: 12px 14px;
      border-bottom: 1px solid #2a2d3a;
    }

    .sidebar-section h2 {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #888;
      margin-bottom: 10px;
    }

    #search-input {
      width: 100%;
      padding: 7px 10px;
      background: #0f1117;
      border: 1px solid #2a2d3a;
      border-radius: 6px;
      color: #e0e0e0;
      font-size: 13px;
      outline: none;
    }
    #search-input:focus { border-color: #4a90e2; }

    #node-info {
      padding: 12px 14px;
      flex: 1;
      overflow-y: auto;
    }

    #node-info .placeholder {
      font-size: 12px;
      color: #555;
      margin-top: 4px;
    }

    #node-info h3 {
      font-size: 13px;
      font-weight: 600;
      color: #fff;
      margin-bottom: 8px;
      line-height: 1.4;
    }

    .info-row {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      margin-bottom: 4px;
    }
    .info-label { color: #777; }
    .info-value { color: #ccc; font-weight: 500; }

    .neighbor-list {
      margin-top: 10px;
    }
    .neighbor-list h4 {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #666;
      margin-bottom: 6px;
    }
    .neighbor-item {
      font-size: 12px;
      padding: 5px 8px;
      background: #0f1117;
      border-radius: 4px;
      margin-bottom: 3px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .neighbor-item:hover { background: #1e2130; }
    .neighbor-item .score-badge {
      font-size: 10px;
      color: #4a90e2;
      font-weight: 600;
    }

    #legend {
      padding: 12px 14px;
      border-bottom: 1px solid #2a2d3a;
      max-height: 180px;
      overflow-y: auto;
    }
    #legend h2 {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #888;
      margin-bottom: 8px;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 12px;
      margin-bottom: 4px;
      cursor: pointer;
      padding: 2px 4px;
      border-radius: 4px;
    }
    .legend-item:hover { background: #0f1117; }
    .legend-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    #loading {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0f1117;
      z-index: 100;
    }
    #loading p { margin-top: 12px; color: #666; font-size: 13px; }
    .spinner {
      width: 32px; height: 32px;
      border: 3px solid #2a2d3a;
      border-top-color: #4a90e2;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .controls {
      display: flex;
      gap: 6px;
    }
    button {
      padding: 5px 10px;
      background: #2a2d3a;
      border: none;
      border-radius: 5px;
      color: #ccc;
      font-size: 12px;
      cursor: pointer;
    }
    button:hover { background: #363a4f; }

    #dataset-select {
      padding: 5px 10px;
      background: #2a2d3a;
      border: none;
      border-radius: 5px;
      color: #ccc;
      font-size: 12px;
      cursor: pointer;
    }
    #dataset-select:focus { outline: none; }
  </style>
</head>
<body>
  <header>
    <h1>Ditto Graph Viewer</h1>
    <select id="dataset-select"></select>
    <span class="stats" id="header-stats">Loading…</span>
    <div class="controls">
      <button id="btn-zoom-in">+</button>
      <button id="btn-zoom-out">−</button>
      <button id="btn-reset">Reset view</button>
    </div>
  </header>

  <div id="main">
    <div id="sigma-container">
      <div id="loading">
        <div class="spinner"></div>
        <p id="loading-msg">Loading data…</p>
      </div>
    </div>

    <div id="sidebar">
      <div class="sidebar-section">
        <h2>Search</h2>
        <input id="search-input" type="text" placeholder="Filter by org name…" />
      </div>

      <div id="legend">
        <h2>Clusters</h2>
        <div id="legend-items"></div>
      </div>

      <div id="node-info">
        <p class="placeholder">Click a node to inspect it.</p>
      </div>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
